name: Build packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (default: the triggering ref)"
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Must be the commit the updater pushed, not the one that triggered it.
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # skipPush disables the automatic post-job push of every new store
      # path (build tools like clang-wrapper, sources, .drv files, ...).
      # The cache is still configured for reading and the auth token is
      # still set up, so `cachix push` below works.
      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: nixos-x86-64-v3-repo
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Check flake
        run: nix flake check --no-build

      - name: Build packages and push their outputs
        shell: bash
        run: |
          set -uo pipefail

          failed_packages=()

          if ! package_json="$(nix eval --json \
            .#cachePackages.x86_64-linux \
            --apply builtins.attrNames)"; then
            echo "::error::Failed to evaluate cachePackages."
            exit 1
          fi

          mapfile -t packages < <(jq -r '.[]' <<< "$package_json")

          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No packages are enabled for Cachix publishing."
            exit 0
          fi

          echo "Packages selected for Cachix:"
          printf ' - %s\n' "${packages[@]}"

          for package in "${packages[@]}"; do
            echo "::group::Building $package"

            if outs="$(nix build \
              ".#cachePackages.x86_64-linux.${package}" \
              --no-link \
              --print-out-paths \
              --print-build-logs)"; then
              echo "Build succeeded: $package"

              # Skip debug outputs; everything else is the package's
              # output(s). `cachix push` uploads each output plus its
              # runtime closure, never build-time tools, and skips paths
              # already on cache.nixos.org.
              mapfile -t push_paths < <(grep -v -- '-debug$' <<< "$outs" || true)

              if [ "${#push_paths[@]}" -gt 0 ]; then
                echo "Pushing closure of:"
                printf ' - %s\n' "${push_paths[@]}"

                cachix push nixos-x86-64-v3-repo "${push_paths[@]}" \
                  || echo "::warning::Push failed for $package"
              fi
            else
              echo "::warning::Build failed for $package"
              failed_packages+=("$package")
            fi

            echo "::endgroup::"
          done

          if [ "${#failed_packages[@]}" -gt 0 ]; then
            echo "::warning::Some packages failed, but the workflow will continue successfully."
            printf ' - %s\n' "${failed_packages[@]}"
          else
            echo "All selected packages built successfully."
          fi
