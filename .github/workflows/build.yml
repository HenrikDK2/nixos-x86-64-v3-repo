name: Build packages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update packages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: nixos-x86-64-v3-repo
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: '(\.drv$|-source$|-debug$|-cross_tools$|-spirv2dxil$|\.(tar\.(gz|xz|bz2|zst)|tgz|zip|patch|diff)$)'

      - name: Check flake
        run: nix flake check --no-build

      - name: Build and push opted-in packages
        shell: bash
        run: |
          set -uo pipefail

          failed_packages=()

          # Read the package list selected by cachePackages in flake.nix.
          if ! package_json="$(nix eval --json \
            .#cachePackages.x86_64-linux \
            --apply builtins.attrNames)"; then
            echo "::error::Failed to evaluate cachePackages."
            exit 1
          fi

          mapfile -t packages < <(
            jq -r '.[]' <<< "$package_json"
          )

          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No packages are enabled for Cachix publishing."
            exit 0
          fi

          echo "Packages selected for Cachix:"
          printf ' - %s\n' "${packages[@]}"

          for package in "${packages[@]}"; do
            echo "::group::Building $package"

            if output="$(nix build \
              ".#cachePackages.x86_64-linux.${package}" \
              --no-link \
              --print-out-paths \
              --print-build-logs)"; then

              echo "Build succeeded: $package"

              if cachix push nixos-x86-64-v3-repo $output; then
                echo "Pushed to Cachix: $package"
              else
                echo "::warning::Cachix push failed for $package"
                failed_packages+=("$package (Cachix push failed)")
              fi
            else
              echo "::warning::Build failed for $package"
              failed_packages+=("$package (build failed)")
            fi

            echo "::endgroup::"
          done

          if [ "${#failed_packages[@]}" -gt 0 ]; then
            echo "::warning::Some packages failed, but the workflow will continue successfully."
            printf ' - %s\n' "${failed_packages[@]}"
          else
            echo "All selected packages built and pushed successfully."
          fi
