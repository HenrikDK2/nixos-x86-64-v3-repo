
name: Build packages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update packages"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: nixos-x86-64-v3-repo
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: '(\.drv$|-source$|-debug$|-cross_tools$|-spirv2dxil$|\.(tar\.(gz|xz|bz2|zst)|tgz|zip|patch|diff)$)'

      - name: Check flake
        run: nix flake check --no-build

      - name: Build and push each package
        shell: bash
        run: |
          set -uo pipefail

          mapfile -t packages < <(
            find pkgs -mindepth 1 -maxdepth 1 -type d \
              -printf '%f\n' | sort
          )

          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No package directories found in pkgs/"
            exit 1
          fi

          failed_packages=()

          for package in "${packages[@]}"; do
            echo "::group::Building $package"

            if output=$(nix build \
              ".#${package}" \
              --no-link \
              --print-out-paths \
              --print-build-logs); then

              echo "Build succeeded: $package"

              if cachix push nixos-x86-64-v3-repo $output; then
                echo "Pushed to Cachix: $package"
              else
                echo "::warning::Cachix push failed for $package"
                failed_packages+=("$package (Cachix push failed)")
              fi
            else
              echo "::warning::Build failed for $package"
              failed_packages+=("$package (build failed)")
            fi

            echo "::endgroup::"
          done

          if [ "${#failed_packages[@]}" -gt 0 ]; then
            echo "::warning::Some packages failed, but the workflow will continue successfully."
            echo "Failed packages:"
            printf ' - %s\n' "${failed_packages[@]}"
          else
            echo "All packages built and pushed successfully."
          fi
