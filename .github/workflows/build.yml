name: Build packages

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"

  push:
    branches:
      - main
    paths:
      - "flake.nix"
      - "flake.lock"
      - "pkgs/**"
      - "kernels/**"
      - "patches/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: cachyos-v3-kernel
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update flake inputs
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        run: nix flake update nix-cachyos-kernel nixpkgs

      - name: Build and publish packages
        run: |
          set -euo pipefail

          packages=$(nix eval --json ".#packages.x86_64-linux" \
            --apply builtins.attrNames | jq -r '.[]')

          for pkg in $packages; do
            echo "::group::Building $pkg"
            nix build ".#packages.x86_64-linux.${pkg}" \
              --no-link \
              --print-out-paths \
              --option substituters \
                "https://cache.nixos.org https://cachyos-v3-kernel.cachix.org" \
              | cachix push cachyos-v3-kernel
            echo "::endgroup::"
          done

      - name: Commit updated lock file
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        run: |
          if ! git diff --quiet -- flake.lock; then
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add flake.lock
            git commit -m "Update flake inputs"
            git push
          fi
