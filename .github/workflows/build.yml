name: Build packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (default: the triggering ref)"
        required: false
        type: string
      strict:
        description: "Fail the run if any package fails to build or push"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        type: string
      strict:
        description: "Fail the run if any package fails to build or push"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Must be the commit the updater staged, not the one that triggered it.
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # skipPush disables the automatic post-job push of every new store
      # path (build tools like clang-wrapper, sources, .drv files, ...).
      # The cache is still configured for reading and the auth token is
      # still set up, so `cachix push` below works.
      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: nixos-x86-64-v3-repo
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Check flake
        run: nix flake check --no-build

      - name: Build packages and push missing outputs
        shell: bash
        env:
          STRICT: ${{ inputs.strict }}
          CACHE_URL: https://nixos-x86-64-v3-repo.cachix.org
        run: |
          set -uo pipefail

          failed_packages=()
          skipped_packages=()

          if ! package_json="$(nix eval --json \
            .#cachePackages.x86_64-linux \
            --apply builtins.attrNames)"; then
            echo "::error::Failed to evaluate cachePackages."
            exit 1
          fi

          mapfile -t packages < <(jq -r '.[]' <<< "$package_json")

          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No packages are enabled for Cachix publishing."
            exit 0
          fi

          echo "Packages selected for Cachix:"
          printf ' - %s\n' "${packages[@]}"

          for package in "${packages[@]}"; do
            echo "::group::Checking $package"
            attr=".#cachePackages.x86_64-linux.${package}"

            # Work out every output path without building anything.
            # Evaluating drvPath writes the .drv to the local store.
            if ! drv="$(nix eval --raw "${attr}.drvPath")" \
              || ! mapfile -t all_outs < <(nix-store -q --outputs "$drv"); then
              echo "::warning::Failed to evaluate outputs for $package"
              failed_packages+=("$package (eval)")
              echo "::endgroup::"
              continue
            fi

            # Debug outputs are never pushed, so they don't count as missing.
            mapfile -t wanted < <(printf '%s\n' "${all_outs[@]}" | grep -v -- '-debug$' || true)

            missing=()
            for path in "${wanted[@]}"; do
              if ! nix path-info --store "$CACHE_URL" "$path" >/dev/null 2>&1; then
                missing+=("$path")
              fi
            done

            if [ "${#missing[@]}" -eq 0 ]; then
              echo "All outputs already on cache; skipping build and push: $package"
              skipped_packages+=("$package")
              echo "::endgroup::"
              continue
            fi

            echo "Missing from cache:"
            printf ' - %s\n' "${missing[@]}"

            # ^* selects ALL outputs (out, dev, modules, ...). Without it,
            # only the default outputs are built and multi-output packages
            # like the kernel would be cached incompletely.
            if outs="$(nix build "${attr}^*" \
              --no-link \
              --print-out-paths \
              --print-build-logs)"; then
              echo "Build succeeded: $package"

              mapfile -t push_paths < <(grep -v -- '-debug$' <<< "$outs" || true)

              if [ "${#push_paths[@]}" -gt 0 ]; then
                echo "Pushing closure of:"
                printf ' - %s\n' "${push_paths[@]}"

                cachix push nixos-x86-64-v3-repo "${push_paths[@]}" || {
                  echo "::warning::Push failed for $package"
                  failed_packages+=("$package (push)")
                }
              fi
            else
              echo "::warning::Build failed for $package"
              failed_packages+=("$package")
            fi

            echo "::endgroup::"
          done

          if [ "${#skipped_packages[@]}" -gt 0 ]; then
            echo "Already cached (skipped):"
            printf ' - %s\n' "${skipped_packages[@]}"
          fi

          if [ "${#failed_packages[@]}" -gt 0 ]; then
            echo "Failed:"
            printf ' - %s\n' "${failed_packages[@]}"
            if [ "$STRICT" = "true" ]; then
              echo "::error::Not promoting: some packages failed."
              exit 1
            fi
            echo "::warning::Some packages failed, but the workflow will continue successfully."
          else
            echo "All selected packages are cached."
          fi
